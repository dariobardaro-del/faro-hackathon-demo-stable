<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARO · Centro de operaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: oklch(0.16 .025 252); --panel: oklch(.205 .024 252); --panel2: oklch(.245 .026 252); --line: oklch(.36 .025 252); --text: oklch(.94 .015 250); --muted: oklch(.70 .025 250); --cyan: oklch(.80 .13 205); --lime: oklch(.82 .15 143); --amber: oklch(.82 .14 82); --red: oklch(.67 .19 28); --radius: 14px; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh} button{font:inherit;color:inherit;cursor:pointer} .shell{max-width:1480px;margin:auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{display:flex;gap:13px;align-items:center}.mark{width:37px;height:37px;border-radius:10px;background:linear-gradient(140deg,var(--cyan),oklch(.65 .14 245));display:grid;place-items:center;color:#09212a;font-weight:700;font-family:'DM Mono';font-size:18px}.eyebrow,.mono{font:12px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)} h1{font-size:21px;margin:1px 0 0;letter-spacing:-.03em}.status{font:12px 'DM Mono';padding:9px 12px;border:1px solid oklch(.48 .08 143/.55);color:var(--lime);border-radius:99px;background:oklch(.25 .05 143/.14)}
    .grid{display:grid;grid-template-columns:310px 1fr 340px;gap:16px}.card{background:linear-gradient(145deg,oklch(.22 .026 252),var(--panel));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 35px oklch(.06 .03 252/.22)}.side{padding:18px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px;font-weight:600}.count{font:11px 'DM Mono';color:var(--cyan);background:oklch(.35 .07 205/.14);padding:3px 7px;border-radius:6px}
    .case{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:12px;margin:4px 0;transition:.18s}.case:hover,.case.active{background:oklch(.31 .025 252);border-color:oklch(.48 .06 205/.65)}.case-top{display:flex;justify-content:space-between;gap:7px;font-size:13px;font-weight:600}.pill{font:10px 'DM Mono';padding:3px 6px;border-radius:5px;white-space:nowrap}.critical{color:var(--red);background:oklch(.55 .16 28/.14)}.medium{color:var(--amber);background:oklch(.64 .12 82/.14)}.low{color:var(--cyan);background:oklch(.55 .11 205/.14)}.case small{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.new{width:100%;border:1px dashed oklch(.50 .08 205/.8);background:oklch(.30 .05 205/.1);padding:11px;border-radius:9px;color:var(--cyan);margin-top:12px;font-weight:600}
    .center{min-height:660px;overflow:hidden}.case-header{padding:22px 24px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.case-header h2{font-size:20px;margin:5px 0 3px;letter-spacing:-.03em}.case-header p{margin:0;color:var(--muted);font-size:13px}.decision{padding:19px 24px;border-bottom:1px solid var(--line)}.decision-card{border:1px solid oklch(.50 .10 205/.55);background:linear-gradient(105deg,oklch(.31 .07 205/.18),transparent);border-radius:11px;padding:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}.decision-label{font:11px 'DM Mono';color:var(--cyan);letter-spacing:.07em;text-transform:uppercase}.decision h3{margin:5px 0 0;font-size:17px}.reason{max-width:260px;color:var(--muted);font-size:12px;line-height:1.45}.workflow{padding:20px 24px}.workflow h3{font-size:14px;margin:0 0 16px}.steps{position:relative}.steps:before{content:'';position:absolute;left:16px;top:17px;bottom:17px;border-left:1px solid var(--line)}.step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:17px}.dot{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;z-index:1;background:var(--panel2);border:1px solid var(--line);font:12px 'DM Mono';color:var(--muted)}.done .dot{background:oklch(.34 .09 143/.25);border-color:oklch(.60 .10 143);color:var(--lime)}.current .dot{background:oklch(.35 .09 205/.3);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px oklch(.55 .12 205/.10)}.step-title{font-size:13px;font-weight:600;padding-top:2px}.step-note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}.sources{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.source{font:10px 'DM Mono';border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--cyan);background:oklch(.3 .04 205/.08)}
    .right .side{height:100%}.approval{border:1px solid oklch(.62 .12 82/.55);background:linear-gradient(140deg,oklch(.32 .08 82/.17),transparent);padding:15px;border-radius:11px;margin:13px 0 20px}.approval h3{font-size:15px;margin:7px 0}.approval p{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 13px}.actions{display:flex;gap:8px}.approve,.reject{border:0;border-radius:8px;padding:9px 10px;font-size:12px;font-weight:600}.approve{background:var(--lime);color:oklch(.19 .04 143)}.reject{background:transparent;border:1px solid var(--line);color:var(--text)}.approve:disabled,.reject:disabled{opacity:.45;cursor:not-allowed}.trace-title{font-size:14px;font-weight:600;margin-bottom:11px}.trace{border-left:1px solid var(--line);margin-left:5px;padding-left:15px}.trace-item{position:relative;margin-bottom:14px;font-size:12px;line-height:1.4}.trace-item:before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;left:-19px;top:4px;background:var(--cyan);box-shadow:0 0 0 3px var(--panel)}.trace-item strong{display:block;font-weight:600}.trace-item span{color:var(--muted);font:10px 'DM Mono'}.notice{font-size:12px;color:var(--lime);background:oklch(.32 .08 143/.16);border:1px solid oklch(.55 .11 143/.36);border-radius:8px;padding:10px;line-height:1.4;margin-bottom:15px}
    .modal{position:fixed;inset:0;background:oklch(.08 .03 252/.75);display:none;place-items:center;padding:18px}.modal.show{display:grid}.modal-box{width:min(560px,100%);padding:24px}.modal h2{margin:4px 0 18px}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:oklch(.17 .02 252);padding:10px;color:var(--text);font:14px 'DM Sans';outline:none}.modal textarea{min-height:80px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.close{background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px}.submit{background:var(--cyan);color:oklch(.17 .04 205);border:0;border-radius:8px;padding:9px 12px;font-weight:700}
    @media(max-width:1050px){.grid{grid-template-columns:270px 1fr}.right{grid-column:1/-1}.right .side{display:grid;grid-template-columns:1fr 1fr;gap:18px}.approval{margin:0}}@media(max-width:700px){.shell{padding:14px}.grid{display:block}.grid>.card{margin-bottom:14px}.center{min-height:auto}.right .side{display:block}.case-header{padding:18px}.decision,.workflow{padding-left:18px;padding-right:18px}.decision-card{display:block}.reason{margin-top:9px}.status{display:none}}
    .approved-state{border:1px solid oklch(.72 .16 143/.8);background:linear-gradient(135deg,oklch(.35 .11 143/.32),oklch(.25 .06 143/.12));color:var(--lime);padding:14px;border-radius:11px;margin-bottom:14px;box-shadow:0 0 0 3px oklch(.62 .13 143/.08)}.approved-state strong{display:block;font:12px 'DM Mono';letter-spacing:.06em}.approved-state span{display:block;color:var(--text);font-size:12px;line-height:1.45;margin-top:7px}
    .cinema-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,oklch(.26 .06 205/.18),transparent)}.live-signal{display:flex;align-items:center;gap:8px;color:var(--cyan);font:11px 'DM Mono';text-transform:uppercase;letter-spacing:.06em}.live-signal i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px oklch(.7 .15 143/.12);animation:pulse 1.5s infinite}.replay{border:1px solid oklch(.62 .12 205/.65);background:oklch(.35 .07 205/.16);color:var(--cyan);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700}.replay:hover{background:oklch(.42 .09 205/.22);transform:translateY(-1px)}
    .activity-feed{display:flex;gap:7px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);min-height:45px}.activity-chip{font:10px 'DM Mono';color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:oklch(.16 .02 252/.6)}.activity-chip.active{color:var(--cyan);border-color:oklch(.62 .12 205/.65);background:oklch(.35 .07 205/.16);animation:chipIn .35s ease-out}.typing{display:inline-flex;gap:3px;margin-left:5px}.typing b{width:3px;height:3px;background:currentColor;border-radius:50%;animation:blink 1s infinite}.typing b:nth-child(2){animation-delay:.16s}.typing b:nth-child(3){animation-delay:.32s}
    .scan-modal{position:fixed;inset:0;z-index:10;background:oklch(.06 .03 252/.76);display:none;place-items:center;padding:18px}.scan-modal.show{display:grid}.scan-box{width:min(720px,100%);padding:18px;border-color:oklch(.55 .10 205/.7);box-shadow:0 0 0 1px oklch(.7 .13 205/.12),0 22px 80px oklch(.02 .03 252/.8)}.scan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.scan-title{font:12px 'DM Mono';color:var(--cyan);letter-spacing:.08em;text-transform:uppercase}.scan-status{font:11px 'DM Mono';color:var(--lime)}.map-preview{height:245px;position:relative;overflow:hidden;border:1px solid oklch(.45 .07 205/.6);border-radius:10px;background:radial-gradient(circle at 62% 42%,oklch(.37 .10 205/.36),transparent 19%),linear-gradient(135deg,oklch(.19 .04 252),oklch(.14 .035 180));margin-bottom:14px}.map-preview:before,.map-preview:after{content:'';position:absolute;background:oklch(.68 .10 205/.5)}.map-preview:before{height:1px;left:8%;right:8%;top:42%;box-shadow:0 46px 0 oklch(.68 .10 205/.35),0 -74px 0 oklch(.68 .10 205/.25)}.map-preview:after{width:1px;top:8%;bottom:8%;left:54%;box-shadow:125px 0 0 oklch(.68 .10 205/.3),-205px 0 0 oklch(.68 .10 205/.25)}.map-label{position:absolute;left:16px;top:14px;font:10px 'DM Mono';color:var(--muted);letter-spacing:.06em}.map-ping{position:absolute;width:28px;height:28px;border-radius:50%;border:1px solid var(--lime);background:oklch(.75 .14 143/.22);box-shadow:0 0 0 9px oklch(.75 .14 143/.08),0 0 28px oklch(.75 .14 143/.7);left:58%;top:39%;animation:ping 1.7s infinite}.scan-log{font:11px 'DM Mono';color:var(--muted);line-height:1.8}.scan-log strong{color:var(--text)}
    @keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:.25}}@keyframes chipIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes ping{50%{box-shadow:0 0 0 16px oklch(.75 .14 143/.03),0 0 35px oklch(.75 .14 143/.85)}}
    @media(max-width:700px){.cinema-bar{padding-left:18px;padding-right:18px}.activity-feed{padding-left:18px;padding-right:18px}.live-signal{font-size:10px}.replay{padding:8px}.map-preview{height:200px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark">F</div><div><div class="eyebrow">Festival ficticio · centro de operaciones</div><h1>FARO</h1></div></div><div class="status">● SISTEMA OPERATIVO</div></header>
    <section class="grid" aria-label="Consola de incidencias FARO">
      <aside class="card side"><div class="section-title">Incidencias <span class="count" id="caseCount">04 ABIERTAS</span></div><div id="caseList"></div><button class="new" id="newCase">+ Simular incidencia</button></aside>
      <section class="card center"><div id="mainPanel"></div></section>
      <aside class="card right"><div class="side" id="tracePanel"></div></aside>
    </section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="card modal-box" id="incidentForm"><div class="eyebrow">Simulador de entrada</div><h2 id="modalTitle">Nueva incidencia sintética</h2><label for="title">Qué ocurrió</label><input id="title" value="Persona desorientada junto al escenario Norte"><label for="zone">Zona del plano</label><select id="zone"><option value="ESCENARIO_NORTE">Escenario Norte</option><option value="ESCENARIO_SUR">Escenario Sur</option><option value="ACCESO_OESTE">Acceso Oeste</option></select><label for="details">Detalle recibido</label><textarea id="details">Asistente reporta que una persona necesita ayuda cerca de la salida de emergencia Norte.</textarea><div class="modal-footer"><button type="button" class="close" id="closeModal">Cancelar</button><button class="submit" type="submit">Procesar con FARO</button></div></form></div>
  <script>
    const cases=[
      {id:'INC-101',title:'Persona descompensada junto a salida E-2',detail:'Alerta de staff · asistencia inmediata',level:'CRÍTICA',type:'critical',decision:'ESCALAR A SEGURIDAD',reason:'La prioridad es asistencia presencial. FARO ubica el puesto médico más cercano y no convierte una situación personal en publicación externa.',protocol:'P-SEG-03 · Bienestar y seguridad',zone:'Plano · Escenario Norte / salida E-2 / puesto médico PM-1',action:'Avisar a Seguridad y asistencia médica; verificar presencialmente en E-2',publish:'No publicar',trace:['Alerta recibida desde canal de staff','Plano consultado: E-2 y puesto médico PM-1 a 80 m','Protocolo P-SEG-03 aplicado','FARO propone escalamiento; espera aprobación humana']},
      {id:'INC-102',title:'Rumor de cancelación del show principal',detail:'Comentarios de público · sin confirmación oficial',level:'MEDIA',type:'medium',decision:'NO PUBLICAR · VERIFICAR',reason:'La fuente no es Producción. Comunicar sin confirmación podría amplificar una información falsa y generar una crisis innecesaria.',protocol:'P-COM-04 · Información no confirmada',zone:'Estado oficial de Producción · sin confirmación',action:'No amplificar; pedir verificación a Producción y mantener monitoreo',publish:'No publicar',trace:['Rumor detectado en monitoreo sintético','Producción no confirmó ninguna cancelación','Protocolo P-COM-04 aplicado','FARO recomienda no publicar; espera validación humana']},
      {id:'INC-103',title:'Salida E-2 cerrada y agua agotada',detail:'Operaciones y Logística confirman · Sector Norte concurrido',level:'CRÍTICA',type:'critical',decision:'ESCALAR Y COMUNICAR',reason:'La combinación puede generar congestión y malestar. Se coordina la respuesta interna y se prepara información útil, sólo con datos confirmados.',protocol:'P-OPS-09 · Desvíos y abastecimiento',zone:'Plano · salida alternativa E-3 / punto de agua B-2',action:'Avisar a Operaciones y Logística; preparar aviso con E-3 y B-2',publish:'Borrador listo para aprobación',trace:['Operaciones confirma cierre preventivo de E-2','Logística confirma falta de agua en A-1','Plano consultado: salida E-3 y punto B-2','Protocolo P-OPS-09 aplicado; espera aprobación humana']}
    ];
    let selected=0, approved={};
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const c=cases[selected];document.getElementById('caseCount').textContent=String(cases.length).padStart(2,'0')+' ABIERTAS';document.getElementById('caseList').innerHTML=cases.map((x,i)=>`<button class="case ${i===selected?'active':''}" data-i="${i}"><div class="case-top"><span>${x.id}</span><span class="pill ${x.type}">${x.level}</span></div><small>${esc(x.title)}</small></button>`).join('');document.querySelectorAll('.case').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;render()});
      const isApproved=approved[c.id];document.getElementById('mainPanel').innerHTML=`<div class="case-header"><div><div class="eyebrow">${c.id} · entrada sintética</div><h2>${esc(c.title)}</h2><p>${c.detail}</p></div><span class="pill ${c.type}">${c.level}</span></div><div class="decision"><div class="decision-card"><div><div class="decision-label">Decisión recomendada por FARO</div><h3>${c.decision}</h3></div><div class="reason">${c.reason}</div></div></div><div class="workflow"><h3>Razonamiento verificable</h3><div class="steps"><div class="step done"><div class="dot">✓</div><div><div class="step-title">Entrada registrada</div><div class="step-note">${c.detail}</div></div></div><div class="step done"><div class="dot">✓</div><div><div class="step-title">Contexto consultado</div><div class="step-note">${c.zone}</div><div class="sources"><span class="source">PLANO</span><span class="source">${c.protocol.split(' · ')[0]}</span></div></div></div><div class="step done"><div class="dot">✓</div><div><div class="step-title">Regla aplicada</div><div class="step-note">${c.protocol}</div></div></div><div class="step ${isApproved?'done':'current'}"><div class="dot">${isApproved?'✓':'4'}</div><div><div class="step-title">${isApproved?'Decisión humana registrada':'Esperando aprobación humana'}</div><div class="step-note">${isApproved?'Acción autorizada: '+c.action:'FARO no ejecuta comunicaciones ni escalamiento externo por su cuenta.'}</div></div></div></div></div>`;
      document.getElementById('tracePanel').innerHTML=`${isApproved?'<div class="notice">Decisión humana registrada. La acción queda habilitada para ejecutar.</div>':''}<div class="eyebrow">Control humano</div><div class="approval"><div class="eyebrow">Acción propuesta</div><h3>${c.action}</h3><p>Estado de publicación: <strong>${c.publish}</strong>. La ejecución requiere validación de una persona responsable.</p><div class="actions"><button class="approve" ${isApproved?'disabled':''} id="approve">${isApproved?'Aprobado':'Aprobar acción'}</button><button class="reject" ${isApproved?'disabled':''} id="reject">Rechazar</button></div></div><div class="trace-title">Traza de decisión</div><div class="trace">${c.trace.map((t,i)=>`<div class="trace-item"><strong>${t}</strong><span>12:${24-i*2<10?'0':''}${24-i*2} · FARO</span></div>`).join('')}${isApproved?'<div class="trace-item"><strong>Aprobación humana registrada</strong><span>AHORA · RESPONSABLE DE TURNO</span></div>':''}</div>`;
      document.getElementById('approve').onclick=()=>{approved[c.id]=true;render()};document.getElementById('reject').onclick=()=>{approved[c.id]=false; c.trace[c.trace.length-1]='Responsable rechazó la propuesta; FARO solicita revisión manual';render()};}
    document.getElementById('newCase').onclick=()=>document.getElementById('modal').classList.add('show');document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('incidentForm').onsubmit=async e=>{e.preventDefault();const title=document.getElementById('title').value.trim(),detail=document.getElementById('details').value.trim(),zone=document.getElementById('zone').value,submit=e.submitter;if(!title||!detail)return;submit.disabled=true;submit.textContent='FARO está analizando…';try{const r=await fetch('/api/incidents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:title,detalle:detail,zona})});const x=await r.json();if(!r.ok)throw Error(x.error);addLiveCase(x,title,detail,zone,'Ejecución real · ahora')}catch(err){const x=localSimulation(title,detail,zone);addLiveCase(x,title,detail,zone,'Simulación local · sin consumo de modelo')}finally{submit.disabled=false;submit.textContent='Procesar con FARO'}};
    function addLiveCase(x,title,detail,zone,mode){const kind=x.clasificacion==='SEGURIDAD'?'critical':x.clasificacion==='COMUNICACION'?'medium':'low';cases.unshift({id:x.incidencia_id||`INC-SIM-${Date.now().toString().slice(-5)}`,title,detail:mode,level:x.clasificacion,type:kind,decision:x.decision_recomendada.replaceAll('_',' '),reason:x.traza?.at(-1)||'Decisión generada por FARO.',protocol:x.contexto_consultado?.at(-1)||'Protocolo consultado',zone:x.contexto_consultado?.[0]||zone,action:x.accion_propuesta,publish:x.publicacion.replaceAll('_',' '),trace:x.traza||[]});selected=0;document.getElementById('modal').classList.remove('show');render()}
    function localSimulation(title,detail,zone){const text=(title+' '+detail).toLowerCase();if(/humo|fuego|descompens|herid|emergenc|peligro/.test(text))return{clasificacion:'SEGURIDAD',decision_recomendada:'ESCALAR A SEGURIDAD',accion_propuesta:'Avisar a Seguridad y verificar presencialmente',publicacion:'NO_PUBLICAR',contexto_consultado:[`Plano · ${zone.replaceAll('_',' ')}`,'P-SEG-03 · Bienestar y seguridad'],traza:['Incidencia sintética registrada','Plano consultado: zona indicada','Protocolo de seguridad aplicado','FARO recomienda escalar; espera aprobación humana']};if(/rumor|cancel|información|confirm/.test(text))return{clasificacion:'COMUNICACION',decision_recomendada:'NO PUBLICAR · VERIFICAR',accion_propuesta:'Pedir confirmación a Producción y no amplificar',publicacion:'NO_PUBLICAR',contexto_consultado:['Estado oficial de Producción','P-COM-04 · Información no confirmada'],traza:['Información no confirmada registrada','Fuente oficial pendiente de validación','Protocolo de comunicación aplicado','FARO recomienda no publicar; espera aprobación humana']};return{clasificacion:'OPERACIONES',decision_recomendada:'ESCALAR A OPERACIONES',accion_propuesta:'Avisar al equipo responsable y preparar respuesta',publicacion:'REQUIERE_APROBACION',contexto_consultado:[`Plano · ${zone.replaceAll('_',' ')}`,'P-OPS-02 · Incidencias operativas'],traza:['Incidencia sintética registrada','Plano consultado: zona indicada','Protocolo operativo aplicado','FARO propone coordinación; espera aprobación humana']}}
    function enhance(){const c=cases[selected], approvedNow=approved[c.id];const sources={'INC-101':'Radio interna de staff y puesto médico','INC-102':'Monitoreo de redes y mensajes en la mesa de control','INC-103':'Parte operativo de Operaciones y Logística'};const outcomes={'INC-101':'Despacho interno a Seguridad y PM-1; verificación presencial solicitada','INC-102':'Se mantiene en monitoreo y se solicita confirmación a Producción','INC-103':'Aviso aprobado y emitido en pantallas principales y altavoces del Sector Norte'};const channels={'INC-101':'Radio operativa y panel interno','INC-102':'Panel interno; ninguna salida pública','INC-103':'Pantallas principales y sistema de altavoces'};const header=document.querySelector('.case-header p');if(header&&!header.dataset.enhanced){header.insertAdjacentHTML('afterend',`<p class="step-note"><strong>Origen del aviso:</strong> ${sources[c.id]||'Entrada recibida en la mesa de control'}</p>`);header.dataset.enhanced='1'}const notice=document.querySelector('.notice');if(approvedNow&&notice)notice.innerHTML=`<strong>APROBADO POR RESPONSABLE DE TURNO</strong><br>Acción ejecutada en la simulación: ${outcomes[c.id]||'Aviso interno preparado para el equipo responsable'}<br><span>Canal: ${channels[c.id]||'Panel interno del centro de operaciones'}</span>`}
    function markApproved(){const c=cases[selected];if(!approved[c.id])return;const panel=document.getElementById('mainPanel');if(panel&&!panel.querySelector('.approved-state')){const banner=document.createElement('div');banner.className='approved-state';banner.innerHTML='<strong>✓ APROBADO Y EJECUTADO EN SIMULACIÓN</strong><span>La decisión humana habilitó la acción. El resultado queda registrado en la traza.</span>';panel.insertBefore(banner,panel.firstChild)}}
    function startReplay(){const c=cases[selected],feed=document.getElementById('activityFeed'),button=document.getElementById('replayCase');if(!feed||!button)return;button.disabled=true;button.textContent='● FARO está trabajando…';feed.innerHTML='';const labels=['ENTRADA RECIBIDA','CONSULTANDO PLANO','APLICANDO PROTOCOLO','REDACTANDO PROPUESTA'];[0,2800,5900,9000].forEach((delay,i)=>setTimeout(()=>{const chip=document.createElement('span');chip.className='activity-chip active';chip.innerHTML=labels[i]+(i===3?'<span class="typing"><b></b><b></b><b></b></span>':'');feed.appendChild(chip);if(i===1){const scan=document.getElementById('scanModal');if(scan){scan.classList.add('show');document.getElementById('scanTitle').textContent='Consultando plano · '+c.zone;document.getElementById('scanLog').innerHTML='<strong>FARO:</strong> ubico la incidencia en el contexto del festival…<br>✓ zona identificada · ✓ ruta y recurso relevante encontrados';setTimeout(()=>scan.classList.remove('show'),2100)}}if(i===3)setTimeout(()=>{button.disabled=false;button.textContent='↻ Repetir reproducción'},3500)},delay))}
    const oldRender=render;render=()=>{oldRender();const panel=document.getElementById('mainPanel');if(panel&&!document.getElementById('replayCase'))panel.insertAdjacentHTML('afterbegin','<div class="cinema-bar"><div class="live-signal"><i></i> Mesa de control · flujo operativo</div><button class="replay" id="replayCase">▶ Iniciar reproducción</button></div><div class="activity-feed" id="activityFeed"><span class="activity-chip active">ENTRADA LISTA</span><span class="activity-chip">PLANO EN ESPERA</span><span class="activity-chip">PROTOCOLO EN ESPERA</span><span class="activity-chip">PROPUESTA EN ESPERA</span></div>');enhance();markApproved();const b=document.getElementById('replayCase');if(b)b.onclick=startReplay};render();
  </script>
  <div class="scan-modal" id="scanModal" role="dialog" aria-live="polite"><div class="card scan-box"><div class="scan-head"><span class="scan-title" id="scanTitle">Consultando plano</span><span class="scan-status">● PROCESANDO</span></div><div class="map-preview"><span class="map-label">FARO / CONTEXTO ESPACIAL / CAPA OPERATIVA</span><span class="map-ping"></span></div><div class="scan-log" id="scanLog"><strong>FARO:</strong> preparando consulta…</div></div></div>
</body></html>
